<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carer Hub</title>
<meta name="description" content="Book, manage and pay for NDIS and Support at Home care for the people you look after, all in one place.">
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Installable app (PWA) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fff7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1417" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carer Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Carer Hub">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Nunito:wght@700;800;900&display=swap">
</head>
<body>
<style>
/* Layout: phone-first app shell. Sticky testing bar, one content column with ruled sections, fixed tab bar, floating alert and AI chat buttons bottom right. */
:root{
  --bg:#FFF7F5;--card:#FFFFFF;--ink:#3B2830;--mute:#765E66;--line:#F0DCDB;
  --brand:#C24F6E;--brand-soft:#FCE7EC;--on-brand:#FFFFFF;
  --green:#3F7D5A;--green-soft:#E3F1E7;
  --coral:#C9583A;--coral-soft:#FDE8DF;--on-coral:#FFFFFF;
  --ok:#2E7652;--ok-soft:#E1F2E7;--warn:#8A5600;--warn-soft:#FFF0D6;--amber:#E39A2D;--on-amber:#2B1A00;
  --bad:#B8322E;--bad-soft:#FCE4E2;--on-bad:#FFFFFF;
  --shadow:0 1px 2px rgba(59,40,48,.05),0 10px 28px rgba(194,79,110,.07);
  --scrim:rgba(40,20,28,.5);--c1:#2F8A5B;--c2:#C24F6E;--c3:#D8932A;--c4:#6E56B0;--cgov:#2F8A5B;--cfam:#F293AB;
  --test:#2A2C31;--test-ink:#EEEFF2;--test-acc:#F2B33D;--test-line:#5C616B;
  --f-display:"Nunito","Atkinson Hyperlegible",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1417;--card:#281D21;--ink:#F7EAEE;--mute:#C7AEB6;--line:#45333B;
  --brand:#F09AB2;--brand-soft:#4A2734;--on-brand:#3A0E1D;--green:#93CFAB;--green-soft:#1F3A2C;
  --coral:#F2A285;--coral-soft:#43281E;--on-coral:#3A1408;
  --ok:#86D4A8;--ok-soft:#173528;--warn:#F2C46E;--warn-soft:#3A2C12;--amber:#F2B54F;--on-amber:#2B1A00;
  --bad:#FF9A92;--bad-soft:#47201E;--on-bad:#3A0805;--shadow:0 1px 2px rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);--c1:#3E9A6A;--c2:#D9668A;--c3:#BE8226;--c4:#8A70D6;--cgov:#3E9A6A;--cfam:#B23E62;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1417;--card:#281D21;--ink:#F7EAEE;--mute:#C7AEB6;--line:#45333B;
  --brand:#F09AB2;--brand-soft:#4A2734;--on-brand:#3A0E1D;--green:#93CFAB;--green-soft:#1F3A2C;
  --coral:#F2A285;--coral-soft:#43281E;--on-coral:#3A1408;
  --ok:#86D4A8;--ok-soft:#173528;--warn:#F2C46E;--warn-soft:#3A2C12;--amber:#F2B54F;--on-amber:#2B1A00;
  --bad:#FF9A92;--bad-soft:#47201E;--on-bad:#3A0805;--shadow:0 1px 2px rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);--c1:#3E9A6A;--c2:#D9668A;--c3:#BE8226;--c4:#8A70D6;--cgov:#3E9A6A;--cfam:#B23E62;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html{font-size:100%}html.big{font-size:115%}
body{background:var(--bg);color:var(--ink);font:1rem/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--test);z-index:40}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0;color:var(--ink)}
h1{font-size:1.75rem;font-weight:900;letter-spacing:-.01em}h2{font-size:1.25rem;font-weight:800}h3{font-size:1.0625rem;font-weight:800}
p{margin:0}a{color:var(--brand);font-weight:700}
.m{color:var(--mute);font-size:.875rem}.num{font-variant-numeric:tabular-nums}.grow{flex:1;min-width:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* testing bar */
#test{position:sticky;top:env(safe-area-inset-top,0px);z-index:41;background:var(--test);color:var(--test-ink);border-bottom:2px dashed var(--test-acc);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tb{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;max-width:960px;margin:0 auto;font:.8125rem system-ui,sans-serif}
.tb-label{display:inline-flex;gap:6px;align-items:center;color:var(--test-acc);font-weight:700}.tb-label .ic{width:16px;height:16px}
.tb-seg{display:inline-flex;border:1px solid var(--test-line);border-radius:8px;overflow:hidden}
.tb-seg button,.tb-btn{background:transparent;color:var(--test-ink);border:0;padding:6px 10px;font:inherit;min-height:34px;cursor:pointer}
.tb-seg button+button{border-left:1px solid var(--test-line)}
.tb-seg button.on{background:var(--test-acc);color:var(--test);font-weight:700}
.tb-btn{border:1px solid var(--test-line);border-radius:8px}

/* shell and section rhythm */
main{max-width:760px;margin:0 auto;padding-block:20px calc(180px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{display:flex;flex-direction:column;gap:32px}
#app>section.sec+section.sec,#app>section.sec.rule{border-top:1px solid var(--line);padding-top:32px}
.apphead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:900 1.2rem var(--f-display);color:var(--ink)}.brand svg{width:36px;height:36px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.avbtn{border:0;background:none;padding:0;border-radius:50%;cursor:pointer}
.sec{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-h{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sec h2{display:flex;align-items:center;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.card.flat{box-shadow:none;background:var(--bg)}
.ib{width:38px;height:38px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:inline-grid;place-items:center;flex:none}
.ib.green{background:var(--green-soft);color:var(--green)}.ib.coral{background:var(--coral-soft);color:var(--coral)}.ib.ok{background:var(--ok-soft);color:var(--ok)}.ib.warn{background:var(--warn-soft);color:var(--warn)}
.ic{width:20px;height:20px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:800 .9375rem/1.2 var(--f-display);border-radius:999px;padding:10px 18px;min-height:44px;border:1.5px solid var(--brand);background:transparent;color:var(--brand);cursor:pointer;text-decoration:none}
.btn.p{background:var(--brand);color:var(--on-brand)}
.btn.green{background:var(--green);border-color:var(--green);color:var(--card)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:var(--on-coral)}
.btn.ghost{border-color:var(--line);color:var(--ink);background:var(--card)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:.8125rem}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;min-height:40px;font:700 .875rem var(--f-body);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.chip.who{padding-left:5px}
.seg{display:inline-flex;background:var(--brand-soft);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;color:var(--brand);font:800 .875rem var(--f-display);padding:6px 16px;border-radius:999px;min-height:36px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap;line-height:1.6}
.pill .ic{width:14px;height:14px}
.ok{background:var(--ok-soft);color:var(--ok)}.warn{background:var(--warn-soft);color:var(--warn)}.bad{background:var(--bad-soft);color:var(--bad)}.info{background:var(--brand-soft);color:var(--brand)}.pred{background:var(--green-soft);color:var(--green)}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:12px 14px}.alert .ic{margin-top:2px}
.alert b{display:block}
label.fld{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.875rem}
input,select,textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;min-height:44px;width:100%}
textarea{resize:vertical}
input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:0;accent-color:var(--brand);flex:none;margin:0}
.chk{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.chk:first-child{border-top:0}
.q{width:32px;height:32px;border:0;background:var(--brand-soft);color:var(--brand);border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;flex:none;padding:0}.q .ic{width:18px;height:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}

/* lists */
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0;padding-top:0}.li:last-child{padding-bottom:0}
.li b{font-family:var(--f-display)}
.av{border-radius:50%;display:block;flex:none;object-fit:cover}

/* home */
.phero{display:flex;gap:16px;align-items:center;background:var(--brand-soft);border-radius:24px;padding:20px;position:relative;overflow:hidden}
.phero .sub{color:var(--mute);font-size:.875rem}
.phero .deco{position:absolute;right:-14px;bottom:-18px;width:130px;height:130px;opacity:.5}
.phero .av{box-shadow:0 0 0 4px var(--card)}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:560px){.qa{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qa button{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:800 .9375rem/1.25 var(--f-display);text-align:left;cursor:pointer;min-height:104px;position:relative;box-shadow:var(--shadow)}
.count{position:absolute;top:12px;right:12px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--bad);color:var(--on-bad);font:800 .75rem/22px var(--f-display);text-align:center}
.stars{display:flex;gap:4px}.stars button{border:0;background:none;color:var(--amber);cursor:pointer;padding:4px;min-width:40px;min-height:40px}
.stars .ic{width:28px;height:28px}
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ins{border-radius:20px;padding:16px;background:var(--green-soft);display:flex;flex-direction:column;gap:8px;min-width:0}
.ins h3{font-size:1rem}.ins p{font-size:.9375rem}
.ins.warn{background:var(--warn-soft)}.ins.warn h3,.ins.warn p{color:var(--warn)}
.conf{font-size:.75rem;color:var(--mute)}

/* calendar */
.calhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.calnav{display:flex;gap:6px;align-items:center}
.calnav b{min-width:140px;text-align:center;font-family:var(--f-display)}
.wk{display:flex;flex-direction:column}
.wkday{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}.wkday:first-child{border-top:0}
.wkday .dl{width:52px;flex:none;text-align:center;font-family:var(--f-display)}
.wkday .dl small{display:block;color:var(--mute);font:700 .75rem var(--f-body)}
.wkday .dl strong{display:block;font-size:1.375rem;line-height:1.1}
.wkday.today .dl strong{color:var(--brand)}
.wkday .ev{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.evc{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--brand-soft);min-width:0}
.evc.new{background:var(--warn-soft)}.evc.gap{background:var(--bad-soft)}.evc.lv{background:var(--line)}
.evc b{font-family:var(--f-display);font-size:.875rem}.evc p{font-size:.8125rem;color:var(--mute)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.mgrid .dh{font:700 .75rem var(--f-body);color:var(--mute);padding-bottom:4px}
.mday{border:0;background:var(--bg);color:var(--ink);border-radius:12px;min-height:52px;padding:6px 2px;font:800 .875rem var(--f-display);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.mday.out{opacity:.35}.mday.today{outline:2px solid var(--brand);outline-offset:-2px}.mday.sel{background:var(--brand);color:var(--on-brand)}.mday.lv{background:var(--line)}
.dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}.dots i{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.dots i.new{background:var(--amber)}.dots i.gap{background:var(--bad)}.mday.sel .dots i{background:var(--on-brand)}
.calkey{display:flex;flex-wrap:wrap;gap:12px;font-size:.8125rem;color:var(--mute)}.calkey span{display:inline-flex;align-items:center;gap:6px}.calkey i{width:9px;height:9px;border-radius:50%;background:var(--brand)}.calkey i.new{background:var(--amber)}.calkey i.gap{background:var(--bad)}

/* book */
details.cat{border:1px solid var(--line);border-radius:18px;background:var(--card)}
details.cat summary{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;list-style:none}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary b{display:block;font-family:var(--f-display)}
details.cat .chev{transition:transform .2s;color:var(--mute)}details.cat[open] .chev{transform:rotate(90deg)}
.cat-body{padding:0 14px 6px 64px;display:flex;flex-direction:column}
@media (max-width:420px){.cat-body{padding-left:14px}}
.stepn span{width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:900 .875rem var(--f-display);flex:none}
.popt{display:flex;gap:12px;align-items:center;width:100%;padding:12px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.popt.on{border-color:var(--brand);background:var(--brand-soft)}
.slotrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.slotrow:first-child{border-top:0}.slotrow>b{min-width:104px;font-size:.875rem;padding-top:8px}
.slotrow>div{display:flex;flex-wrap:wrap;gap:6px}
.slot{min-height:38px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--brand);background:var(--card);color:var(--brand);font:800 .8125rem var(--f-display);cursor:pointer}
.slot.on{background:var(--brand);color:var(--on-brand)}.slot.usual{border-color:var(--green);color:var(--green)}
.sum{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:.9375rem;margin:0}.sum dt{color:var(--mute)}.sum dd{margin:0;font-weight:700}

/* find */
.pcard{display:flex;gap:14px;align-items:flex-start;position:relative}
.pcard .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8125rem;color:var(--mute)}
.pcard .meta span{display:inline-flex;align-items:center;gap:4px}.pcard .meta .ic{width:15px;height:15px}
.heart{position:absolute;top:0;right:0;border:0;background:none;color:var(--brand);cursor:pointer;width:40px;height:40px;display:grid;place-items:center}
.heart[aria-pressed="true"] .ic{fill:var(--brand)}
.team{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px}
.team button{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:var(--ink);font:800 .8125rem var(--f-display);cursor:pointer;min-width:72px}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.badges{display:flex;flex-wrap:wrap;gap:6px}

/* budget */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat.pred{background:var(--green-soft);border-color:transparent}
.stat .lab{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:.8125rem;color:var(--mute);font-weight:700}
.stat strong{font:900 1.375rem var(--f-display);font-variant-numeric:tabular-nums}
.hbar{height:12px;border-radius:6px;background:var(--brand-soft);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:6px;background:var(--brand)}.hbar i.hi{background:var(--amber)}
.brow{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}.brow:first-child{border-top:0;padding-top:0}
.brow .top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font:700 10px var(--f-body)}
.chart .lbl{fill:var(--ink)}
.chart [data-a]{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8125rem;color:var(--mute)}
.key{display:inline-flex;align-items:center;gap:6px}.key i{width:18px;border-top:2px solid var(--brand)}
.key i.pace{border-top-style:dashed;border-color:var(--mute)}.key i.proj{border-top-style:dotted;border-top-width:3px}
.key i.blk{width:12px;height:12px;border:0;border-radius:3px;background:var(--brand)}.key i.out{width:12px;height:12px;border:1.5px dashed var(--brand);border-radius:3px}
.hist{width:100%;border-collapse:collapse;font-size:.875rem}
.hist th{text-align:left;color:var(--mute);font-weight:700;font-size:.75rem;padding:6px 8px 6px 0}
.hist td{padding:10px 8px 10px 0;border-top:1px solid var(--line);vertical-align:top}
.hist td.r,.hist th.r{text-align:right;padding-right:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
.selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--brand-soft);color:var(--brand);font-weight:700}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:.8125rem;font-weight:700;max-width:220px}

/* support */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card);min-width:0}
.tile .art{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.tile .art .ic{width:28px;height:28px}

/* onboarding */
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--brand);border-radius:4px}
@media (prefers-reduced-motion:no-preference){.prog i,.hbar i{transition:width .4s}}

/* ---------- invoice checks ---------- */
function check(v){
 const isN=prog(v.who)=='ndis',c=CAPS[v.cat],r=[];
 if(isN){
  if(c){const o=+(v.rate-c.cap).toFixed(2);r.push(o>0?{ok:0,cap:1,t:`Over the price limit by ${money(o)}/hr`,d:`Billed ${money(v.rate)}/hr. The limit for ${c.name.toLowerCase()} (${c.code}) is ${money(c.cap)}/hr, so this invoice is ${money(o*v.hrs)} over across ${v.hrs} hrs.`}:{ok:1,t:'Within the price limit',d:`${money(v.rate)}/hr is under the ${money(c.cap)}/hr limit for ${c.name.toLowerCase()}.`})}
  else r.push({ok:1,t:'Price limit not checked',d:'This demo only holds limits for cleaning and yard work.'});
  r.push({ok:1,t:'Matches a funded support',d:CAT(v.cat).ndis});
 }else{
  const o=+(v.rate-v.agreed).toFixed(2);
  r.push(o>0?{ok:0,t:`${money(o)}/hr above the agreed price`,d:`Billed ${money(v.rate)}/hr. The service agreement says ${money(v.agreed)}/hr, so this invoice is ${money(o*v.hrs)} too high.`}:{ok:1,t:'Matches the agreed price',d:`${money(v.rate)}/hr, as in the service agreement.`});
  const cp=copay(v.cat);r.push({ok:1,t:`Margaret's co-payment: ${money(v.rate*v.hrs*cp)}`,d:`${sahType(v.cat)} services: ${pct(cp)} for a full pensioner (sample rate).`});
 }
 r.push(v.km<=.5?{ok:1,t:'Visit was at the home address',d:`Check-in logged ${v.km} km from home.`}:{ok:0,t:`Visit logged ${v.km} km from the home address`,d:'Check-ins should be within 0.5 km of home. Ask the provider why before you pay.'});
 const bad=r.filter(x=>!x.ok);
 return{r,bad,st:!bad.length?'clear':(isN&&S.ndia&&bad.some(x=>x.cap))?'blocked':'review'};
}
const invOpen=()=>S.invs.filter(v=>!S.invSt[v.id]&&check(v).st!='clear');

/* ---------- predictions ---------- */
function ndisPace(){
 const st=pd(NDIS.start),en=pd(NDIS.end),Nd=days(st,en)+1,T=days(st,TODAY),bud=NDIS.cats[0].a;
 let cum=0;const pts=[[0,0,'15 Mar: $0']];
 NDIS.core.forEach(([m,v],i)=>{cum+=v;const last=i==NDIS.core.length-1,dt=last?TODAY:new Date(2026,2+i+1,0,12);pts.push([days(st,dt),cum,`${fmtS(iso(dt))}: ${money(cum)} spent`])});
 const recent=(NDIS.core[7][1]+NDIS.core[6][1]+NDIS.core[5][1])/3/30.4,run=T+(bud-cum)/recent,early=Math.round(Nd-run),runDate=new Date(st);runDate.setDate(runDate.getDate()+Math.round(run));
 return{st,Nd,T,bud,cum,pts,recent,run,early,runDate};
}
function predictions(w){const out=[];
 if(prog(w)=='ndis'){const pc=ndisPace();
  if(pc.early>0)out.push({lvl:'warn',ic:'wallet',t:`Core runs out around ${fmtS(iso(pc.runDate))}`,b:`Based on the last 3 months of spending, about ${Math.round(pc.early/7)} weeks before the plan ends.`,conf:'High confidence',act:['go','budget|pace','See forecast']});
  out.push({ic:'calendar',t:'Plan review due in March',b:'Jamie turns 18 around the same time. Start gathering reports now so the new plan reflects adult supports.',conf:'Based on plan dates',act:['go','support|advice','What to prepare']});
  const u=usual('omar','jamie');if(u)out.push({ic:'repeat',t:`Jamie usually goes out with Omar on ${DOW[u.dw]}s`,b:'Book the next 4 weeks in one go?',conf:'From booking history',act:['rebook','omar','Book 4 weeks']});
 }else if(prog(w)=='sah'){const c=curQ(),pcs=SAH.quarters.slice(0,3).map(pcOf),grow=Math.round((pcs[2]/pcs[0]-1)*100);
  if(c.lost>0)out.push({lvl:'warn',ic:'wallet',t:`About ${money(c.lost)} may go back unused`,b:`Projected ${money(c.unspent)} left on 31 Dec, but only ${money(c.roll)} carries over.`,conf:'High confidence',act:['go','budget|pace','See options']});
  out.push({ic:'trend',t:`Personal care up ${grow}% this year`,b:'If this keeps rising, Margaret may need a higher classification within about 6 months. Reassessments take weeks, so start early.',conf:'Medium confidence',act:['go','support|advice','How to reassess']});
  if(gapJobs().length)out.push({lvl:'warn',ic:'users',t:'Cover needed on 22 Dec',b:'Sam Kaur and Lena Petrova are likely free that morning.',conf:'From calendars',act:['urgent','gap','Find cover']});
  const u=usual('priya','margaret');if(u)out.push({ic:'repeat',t:`Margaret usually has cleaning on ${DOW[u.dw]}s at ${u.t}`,b:'Book the next 4 weeks in one go?',conf:'From booking history',act:['rebook','priya','Book 4 weeks']});
  const nxt=SAH.quarters.slice(1,3).reduce((a,q)=>a+qCopay(q),0)/2;out.push({ic:'file',t:`About ${money(Math.round(nxt))} in co-payments next quarter`,b:'Based on the last two quarters, with personal care now fully funded.',conf:'Medium confidence'});
 }
 return out;
}
function insightsHTML(w,max=4){const ps=predictions(w).slice(0,max);if(!ps.length)return'';
 return `<div class="insights">${ps.map(p=>`<div class="ins ${p.lvl||''}"><div class="row" style="justify-content:space-between">${ib(p.ic,p.lvl=='warn'?'warn':'green')}<span class="conf">${esc(p.conf)}</span></div><h3>${esc(p.t)}</h3><p>${esc(p.b)}</p>${p.act?`<button class="btn sm ${p.lvl=='warn'?'':'green'}" style="align-self:flex-start" data-a="${p.act[0]}" data-v="${p.act[1]}">${esc(p.act[2])}</button>`:''}</div>`).join('')}</div>`}

/* ---------- charts ---------- */
function paceChart(){const pc=ndisPace(),{Nd,T,bud,cum,pts,recent,run}=pc;
 const W=340,H=210,L=44,R=14,Tp=16,B=28,ymax=15000,x=d=>L+(W-L-R)*d/Nd,y=v=>Tp+(H-Tp-B)*(1-v/ymax);
 let g='';[0,5000,10000,15000].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${v?('$'+v/1000+'k'):'$0'}</text>`});
 for(let mi=3;mi<15;mi+=2){const dt=new Date(2026,mi,1,12),d=days(pd(NDIS.start),dt);if(d<=Nd)g+=`<text x="${x(d)}" y="${H-B+16}" text-anchor="middle">${MON[mi%12]}</text>`}
 g+=`<line x1="${L}" x2="${W-R}" y1="${y(bud)}" y2="${y(bud)}" stroke="var(--mute)" stroke-width="1"/><text x="${W-R}" y="${y(bud)-5}" text-anchor="end" class="lbl">Core budget ${money(bud)}</text>`;
 g+=`<line x1="${x(0)}" y1="${y(0)}" x2="${x(Nd)}" y2="${y(bud)}" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
 const ex=Math.min(run,Nd);g+=`<line x1="${x(T)}" y1="${y(cum)}" x2="${x(ex)}" y2="${y(Math.min(bud,cum+recent*(ex-T)))}" stroke="var(--green)" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round"/>`;
 g+=`<polyline points="${pts.map(p=>x(p[0])+','+y(p[1])).join(' ')}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round"/>`;
 g+=pts.slice(1).map(p=>`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="3.5" fill="var(--brand)" stroke="var(--card)" stroke-width="2"/><circle cx="${x(p[0])}" cy="${y(p[1])}" r="11" fill="transparent" data-tip="${esc(p[2])}" tabindex="0"/>`).join('');
 if(run<Nd)g+=`<circle cx="${x(run)}" cy="${y(bud)}" r="5" fill="var(--amber)" stroke="var(--card)" stroke-width="2"/><circle cx="${x(run)}" cy="${y(bud)}" r="12" fill="transparent" data-tip="Predicted to run out ${fmtS(iso(pc.runDate))}" tabindex="0"/>`;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Core spending compared with an even pace, with a forecast">${g}</svg>`;
}
function bars(data,{h=170,ymax,ticks,fmtT=v=>v?('$'+(v>=1000?(v/1000)+'k':v)):'$0',ref,refLabel,sel,act}){
 const W=340,H=h,L=40,R=10,Tp=16,B=26,n=data.length,bw=(W-L-R)/n,y=v=>Tp+(H-Tp-B)*(1-v/ymax);
 let g='';ticks.forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${fmtT(v)}</text>`});
 const top=(x0,w,v)=>{const yy=y(v),r=Math.min(4,w/2,(H-B-yy));return `M${x0} ${H-B}V${yy+r}q0 -${r} ${r} -${r}h${w-2*r}q${r} 0 ${r} ${r}V${H-B}Z`};
 data.forEach((d,i)=>{const w=Math.min(36,bw*.62),x0=L+bw*i+(bw-w)/2,dim=sel!=null&&sel!==i;
  if(d.proj)g+=`<rect x="${x0}" y="${y(d.proj)}" width="${w}" height="${H-B-y(d.proj)}" rx="4" fill="none" stroke="var(--green)" stroke-width="1.5" stroke-dasharray="4 3" ${dim?'stroke-opacity=".5"':''}/>`;
  g+=`<path d="${top(x0,w,d.v)}" fill="var(--brand)" fill-opacity="${dim?.35:d.part?.7:1}"/>`;
  if(sel===i)g+=`<path d="M${x0-3} ${H-B+3}h${w+6}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>`;
  g+=`<rect x="${L+bw*i}" y="${Tp}" width="${bw}" height="${H-Tp-B}" fill="transparent" data-tip="${esc(d.tip)}" ${act?`data-a="${act}" data-v="${i}" role="button" aria-label="Show ${esc(d.l)}"`:''} tabindex="0"/>`;
  g+=`<text x="${x0+w/2}" y="${H-B+15}" text-anchor="middle" ${sel===i?'class="lbl"':''}>${esc(d.l)}</text>`});
 if(ref)g+=`<line x1="${L}" x2="${W-R}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(ref)-5}" text-anchor="end" class="lbl">${esc(refLabel)}</text>`;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(data.map(d=>d.tip).join('; '))}">${g}</svg>`;
}

/* ---------- calendars ---------- */
const wkStart=off=>{const d=new Date(D0);d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return d};
function famCal(){const c=S.cal,list=S.jobs.filter(j=>(c.all||j.who==S.who)&&j.st!='no');
 const nav=c.mode=='week'?(()=>{const s=wkStart(c.off),e=new Date(s);e.setDate(e.getDate()+6);return `${fmtS(iso(s))} to ${fmtS(iso(e))}`})():(()=>{const d=new Date(D0.getFullYear(),D0.getMonth()+c.off,1);return `${MON[d.getMonth()]} ${d.getFullYear()}`})();
 let h=`<div class="calhead"><div class="seg" role="group" aria-label="Calendar view">${['week','month'].map(m=>`<button class="${c.mode==m?'on':''}" data-a="calmode" data-v="${m}" aria-pressed="${c.mode==m}">${m=='week'?'Week':'Month'}</button>`).join('')}</div>
 <div class="calnav"><button class="iconbtn" data-a="caloff" data-v="-1" aria-label="Previous">${ico('chevl')}</button><b>${nav}</b><button class="iconbtn" data-a="caloff" data-v="1" aria-label="Next">${ico('chev')}</button></div></div>
 <label class="chk" style="padding:0;border:0"><input type="checkbox" id="calall" data-a="calall" ${c.all?'checked':''}><span>Show everyone you care for</span></label>`;
 const evc=j=>`<div class="evc ${jobCls(j)}">${face(j.prov,32)}<div class="grow"><b>${j.t}${c.all?`, ${esc(P[j.who].first)}`:''}</b><p>${esc(P[j.prov].name)}: ${esc(j.items.join(', '))}</p></div>${j.st!='ok'||jobCls(j)?jobPill(j):''}</div>`;
 if(c.mode=='week'){const s=wkStart(c.off);h+='<div class="wk">';
  for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);const k=iso(d),js=list.filter(j=>j.d==k).sort(byDate);
   h+=`<div class="wkday ${k==iso(D0)?'today':''}"><div class="dl"><small>${DOW[d.getDay()].slice(0,3)}</small><strong>${d.getDate()}</strong></div><div class="ev">${js.length?js.map(evc).join(''):'<p class="m" style="padding-top:6px">Nothing booked</p>'}</div></div>`}
  h+='</div>';
 }else{const first=new Date(D0.getFullYear(),D0.getMonth()+c.off,1,12),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  h+=`<div class="mgrid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<span class="dh">${x}</span>`).join('')}`;
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d),js=list.filter(j=>j.d==k);
   h+=`<button class="mday ${d.getMonth()!=first.getMonth()?'out':''} ${k==iso(D0)?'today':''} ${c.day==k?'sel':''}" data-a="calday" data-v="${k}" aria-label="${fmt(k)}, ${js.length} visit${js.length==1?'':'s'}">${d.getDate()}<span class="dots">${js.slice(0,3).map(j=>`<i class="${jobCls(j)}"></i>`).join('')}</span></button>`}
  h+=`</div><div class="calkey"><span><i></i>Booked</span><span><i class="new"></i>Waiting to confirm</span><span><i class="gap"></i>Needs cover</span></div>`;
  if(c.day){const js=list.filter(j=>j.d==c.day).sort(byDate);h+=`<div class="stack"><b style="font-family:var(--f-display)">${fmt(c.day)}</b>${js.length?js.map(evc).join(''):'<p class="m">Nothing booked. <a href="#" data-a="calbook" data-v="'+c.day+'">Book this day</a></p>'}</div>`}
 }
 return h;
}

  const cost=q.rate?q.rate*2:null,cp=p.prog=='sah'&&cost?sel.reduce((m,k)=>Math.max(m,copay(k.split('|')[0])),0):0,capc=CAPS[selCats[0]];
  h+=`<section class="sec"><h2 class="stepn"><span>4</span>Check and send</h2><div class="card"><dl class="sum">

   <dt>Estimate</dt><dd class="num">${cost?`${money(cost)} for 2 hrs`:esc(q.unit||'Quote')}</dd>
   <dt>Paid from</dt><dd>${p.prog=='ndis'?esc(CAT(selCats[0]).ndis):`Quarterly budget${cost?`. Margaret pays about ${money(cost*cp)}`:''}`}</dd></dl>
   ${p.prog=='ndis'&&capc&&q.rate?(q.rate<=capc.cap?`<div class="alert ok">${ico('shield')}<div>${money(q.rate)}/hr is within the ${money(capc.cap)}/hr price limit.</div></div>`:`<div class="alert warn">${ico('excl')}<div>${money(q.rate)}/hr is ${money(q.rate-capc.cap)}/hr over the price limit.</div></div>`):''}
   ${p.prog=='ndis'&&cost?`<div class="alert info">${ico('spark')}<div>Predicted: this booking${b.rep!='once'?` series (${b.rep=='weekly'?4:2} visits)`:''} brings Core's run-out date forward by about ${Math.max(1,Math.round(cost*(b.rep=='weekly'?4:b.rep=='fortnightly'?2:1)/ndisPace().recent))} days.</div></div>`:''}
   <div class="alert info">${ico('clock')}<div>${esc(q.name.split(' ')[0])}'s calendar may not be fully synced with Carer Hub. We'll text a link so they can confirm the time.</div></div>
   <button class="btn p full" data-a="book" ${b.d?'':'disabled'}>Send booking request</button></div></section>`;
 }
 return h;
};
function slotsUI(){const b=S.bk,q=P[b.prov],n=nextFree(b.prov),w=b.w||0,u=usual(b.prov,S.who);
 let h=`<div class="row">${n?`<button class="btn p" data-a="slot" data-v="${n[0]}|${n[1]}">${ico('bolt')}Next available: ${fmt(n[0])}, ${n[1]}</button>`:`<p class="m">${esc(q.name)} has no free times in the next 3 months.</p>`}</div>
 ${u?`<p class="m">${predPill} You usually book ${esc(q.name.split(' ')[0])} on ${DOW[u.dw]}s at ${u.t}. Those times are outlined in green.</p>`:''}`;
 h+=`<div class="row"><button class="btn sm ghost" data-a="wk" data-v="-1" ${w?'':'disabled'}>Earlier</button><span class="m grow" style="text-align:center">${fmtS(iso(addD(w*7+1)))} to ${fmtS(iso(addD(w*7+7)))}</span><button class="btn sm ghost" data-a="wk" data-v="1">Later</button></div><div>`;
 for(let i=1;i<=7;i++){const d=addD(w*7+i),k=iso(d),f=free(b.prov,d);
  h+=`<div class="slotrow"><b>${fmt(k)}</b><div>${f.length?f.map(t=>`<button class="slot ${b.d==k&&b.t==t?'on':''} ${u&&u.dw==d.getDay()&&u.t==t?'usual':''}" data-a="slot" data-v="${k}|${t}" aria-pressed="${b.d==k&&b.t==t}">${t}</button>`).join(''):`<span class="m" style="padding-top:8px">${onLeave(b.prov,k)?'On leave':'Not available'}</span>`}</div></div>`}
 return h+'</div>';
}

function findResults(){const f=S.f,q=f.q.trim().toLowerCase();

function obChecklist(o){const pv=esc(o.prev||'your current provider');

  :o.from=='switch'?[`Check your agreement with ${pv} for the notice period`,'Choose a new registered provider that lets you pick your own workers','Agree a change date with both providers','Ask '+pv+' for a final statement and how unspent funds transfer','Move your workers across, or find new ones in Find']
  :['Link the registered provider that holds the budget','Upload current service agreements','Invite your workers'];
 if(o.prog=='ndis')return o.from=='fresh'?['Check eligibility and submit an access request to the NDIA (1800 800 110)','Gather reports from doctors, therapists and school','At the planning meeting, ask to self-manage some or all funding','Set up a separate bank account for plan payments','Invite your workers and turn on invoice checks']
  :o.from=='switch'?['Ask the NDIA to change the plan to self-managed (call 1800 800 110 or raise it at a check-in)',`Give ${pv} notice under your service agreement`,`Ask ${pv} for final invoices and a statement`,'Set up a bank account for plan payments','Move your workers across, or find new ones in Find']
  :['Connect the plan details (we never ask for your myGov password)','Upload current service agreements','Invite your workers'];
 return ['Answer a few questions so we can suggest the right program','Under 65 with a lasting disability? The NDIS is usually the place to start','65 or older (50 or older for First Nations people)? Start with My Aged Care','We\'ll save your answers so you can pick up later'];
}

/* ---------- AI chat ---------- */
let sampleFn=null,chatCtl=null;
(async()=>{try{sampleFn=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){sampleFn=null}S.ai=sampleFn?'on':'off';renderChat()})();
const RULES=()=>`You are the AI assistant inside Carer Hub, a proof-of-concept app that helps Australian families manage NDIS and Support at Home (aged care) supports and their own workers.
Reply in plain, warm Australian English, in under 120 words, as plain text without markdown, headings or bullet symbols.
Give practical, factual guidance. You are not a lawyer or financial adviser: for decisions, suggest checking with the NDIA (1800 800 110), My Aged Care (1800 200 422) or their provider. For scams: Scamwatch, and IDCARE on 1800 595 160.
Point to app tabs where useful: Home, Find, Calendar, Budget, Support, Profile, and the Urgent cover button.
All figures in the app are sample data. Never invent figures that are not in the context.
App context: ${chatContext()}`;
function fallbackReply(t){const q=t.toLowerCase();
 if(/reassess|review|more funding/.test(q))return prog(S.who)=='ndis'?'Ask the NDIA for a plan reassessment through a check-in or by calling 1800 800 110. Bring recent reports and the forecast chart from the Budget tab.':'Call My Aged Care on 1800 200 422 and ask for a reassessment. Write down what has changed, like falls or new help with showering.';
 if(/scam|suspicious|fraud/.test(q))return 'Don\'t reply, click links or pay. Screenshot the message, then report it to Scamwatch. If you shared bank or myGov details, call your bank and IDCARE on 1800 595 160.';
 if(/equipment|bed|chair|tablet|ipad|rail/.test(q))return prog(S.who)=='ndis'?'Low-cost items under $1,500 usually come from Core consumables with no quote. Bigger items come from Capital and need a quote or assessment. Standard tablets are usually not funded.':'Equipment comes from separate AT-HM funding, not the quarterly budget. An OT assessment sets the tier: under $500, up to $2,000 or up to $15,000.';
 if(/budget|run out|unspent|money/.test(q))return 'Open the Budget tab to see the forecast. Tap any quarter or month in the chart to see exactly where the money went.';
 return 'Thanks. A support adviser will reply here within one business day.';
}
async function chatSend(text){text=(text||'').trim();if(!text)return;
 S.chat.push({from:'me',t:text});const msg={from:'ai',t:'',think:true};S.chat.push(msg);renderChat();
 if(!sampleFn||S.ai=='off'){setTimeout(()=>{msg.think=false;msg.t=fallbackReply(text);msg.preset=true;chatArrived()},700);return}
 const turns=[{role:'user',content:RULES()},{role:'assistant',content:'Understood. I\'ll help using that context.'}];
 S.chat.slice(-13,-1).forEach(m=>{if(m.t&&!m.err)turns.push({role:m.from=='me'?'user':'assistant',content:m.t})});
 chatCtl=new AbortController();
 try{await sampleFn(turns,{cache:false,modelTier:'quick',signal:chatCtl.signal,onText:({text})=>{msg.think=false;msg.t=text;renderChatLog()}});msg.think=false;chatArrived()}
 catch(e){msg.think=false;const c=e&&e.code;
  if(c=='cancelled'){msg.t=(e.text||'')+(e.text?'':'Stopped.');}
  else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){S.ai='off';msg.t=fallbackReply(text);msg.preset=true}
  else if(c=='rate_limited'){msg.t='Too many questions at once. Try again in a minute.';msg.err=1}
  else if(c=='refused'){msg.t='I can\'t help with that one. Try asking another way, or tap Talk to a person.';msg.err=1}
  else{msg.t=(e&&e.text?e.text+'\n\n':'')+'The connection dropped. Send your question again.';msg.err=1}
  chatArrived()}
 chatCtl=null;
}
function chatArrived(){if(!S.chatOpen)S.chatUnread++;renderChat()}
function chatChips(){if(S.role=='provider')return ['When does my insurance expire?','How do I mark leave?','What can a support helper do?'];

function stacked(data,{h=190,ymax,ticks,sel,act,ref,refLabel}){
 const W=340,H=h,L=40,R=10,Tp=16,B=26,n=data.length,bw=(W-L-R)/n,y=v=>Tp+(H-Tp-B)*(1-v/ymax),fmtT=v=>v?'$'+(v>=1000?(v/1000)+'k':v):'$0';
 let g='';ticks.forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${fmtT(v)}</text>`});
 const seg=(x0,w,v0,v1,fill,round,op)=>{const y0=y(v0),y1=y(v1);if(y0-y1<.5)return'';const r=round?Math.min(4,w/2,y0-y1):0;return `<path d="M${x0} ${y0}V${y1+r}q0 -${r} ${r} -${r}h${w-2*r}q${r} 0 ${r} ${r}V${y0}Z" fill="${fill}" fill-opacity="${op}"/>`};
 data.forEach((d,i)=>{const w=Math.min(36,bw*.62),x0=L+bw*i+(bw-w)/2,dim=sel!=null&&sel!==i,op=dim?.35:1;
  if(d.proj)g+=`<rect x="${x0}" y="${y(d.proj)}" width="${w}" height="${H-B-y(d.proj)}" rx="4" fill="none" stroke="var(--c1)" stroke-width="1.5" stroke-dasharray="4 3" ${dim?'stroke-opacity=".5"':''}/>`;
  g+=seg(x0,w,0,d.g,'var(--cgov)',!d.f,op);if(d.f)g+=seg(x0,w,d.g+ymax*.006,d.g+d.f,'var(--cfam)',true,op);
  if(sel===i)g+=`<path d="M${x0-3} ${H-B+3}h${w+6}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>`;

 ${ks.map(k=>{const c=CUST[k],p=P[k],open=openOf(t=>t.who==k&&t.st!='done'),last=S.corr.filter(x=>x.e=='c:'+k&&x.ch!='app').sort((a,b)=>b.t-a.t)[0];

function custProfile(k){const c=CUST[k],p=P[k],e='c:'+k,rep=c.rep?P[c.rep]:null,tab=S.ctab||'over',items=openOf(t=>t.who==k),nOpen=items.filter(t=>t.st!='done').length;
 return `<div><button class="back" data-a="sback" data-v="scust">${ico('chevl')}All customers</button></div>
 <div class="phead">${face(k,56)}<div class="grow"><h1>${esc(p.name)}</h1><p class="m">${c.id} · ${esc(c.fund)} · ${esc(c.addr)}</p><div class="mods">${c.mods.filter(modOn).map(modTag).join('')}</div></div>
 <div class="acts"><a class="btn sm ghost" href="${tel(c.phone)}">${ico('phone')}Call ${esc((rep||p).name.split(' ')[0])}</a>${c.email?`<a class="btn sm ghost" href="mailto:${c.email}">${ico('mail')}Email</a>`:''}<button class="btn sm p" data-a="ctab" data-v="corr">${ico('plus')}Log correspondence</button></div></div>
 ${profTabs(tab,[['over','Overview'],['corr','Correspondence'],['docs','Documents'],['work','Work items',nOpen]],'ctab')}
 ${tab=='over'?custOver(k):tab=='corr'?`<div class="pgrid"><div class="psec"><h2>Log correspondence</h2>${corrForm(e)}</div><div class="psec"><h2>History</h2>${corrList(e)}</div></div>`:tab=='docs'?`<div class="psec"><h2>Documents</h2>${docsTable(c.docs)}</div>`:`<div class="qtable">${items.length?items.sort(tixSort).map(tixRow).join(''):'<p class="qempty">No work items for this customer.</p>'}</div>`}`}
function custOver(k){const c=CUST[k],rep=c.rep?P[c.rep]:null,comp=[];
 if(modOn('care')&&c.contact&&c.mods.includes('care')){const left=30-c.contact.last;comp.push(['Monthly care contact',`Last contact ${c.contact.last?c.contact.last+' days ago':'today'}. ${left<0?'Overdue':left<=1?'Due today':'Due in '+left+' days'}.`,left<=2?'due':'ok','care'])}
 c.docs.filter(d=>d[2]!='ok'&&modOn(d[1])).forEach(d=>comp.push([d[0],d[3],d[2],d[1]]));
 openOf(t=>t.who==k&&t.st!='done'&&t.kind=='esc').forEach(t=>comp.push([t.title,tixDueTxt(t)[0],'bad',tMod(t)]));
 const dl=[['Client ID',c.id],['Funding',c.fund+'\n'+c.fundD],['Address',c.addr],['Main contact',rep?`${rep.name}, ${c.repRole}`:c.repRole],['Phone',c.phone],['Email',c.email||'None. Use phone or letter.'],['Care partner',c.partner?P[c.partner].name:'Not applicable'],['Agreed contact',c.contact?c.contact.mode:'As needed'],['Preferences',c.pref],['Customer since',c.since]];
 return `<div class="pgrid"><div class="pcol"><div class="psec"><h2>Details</h2><dl class="dl">${dl.map(([a,b])=>`<dt>${a}</dt><dd>${esc(b).replace('\n','<br><span class="m">')+(b.includes('\n')?'</span>':'')}</dd>`).join('')}</dl></div>
 <div class="psec"><h2>Workers and providers</h2><ul class="clist">${c.providers.filter(x=>PROV[x]).map(x=>`<li><button class="plink" data-a="sopen" data-v="p:${x}">${face(x,32)}<span class="grow"><b>${esc(P[x].name)}</b><span class="m">${esc(P[x].title||'')}</span></span>${ico('chev')}</button></li>`).join('')}</ul></div></div>
 <div class="pcol"><div class="psec"><h2>Needs attention</h2>${compRows(comp)}</div>
 <div class="psec"><div class="row" style="justify-content:space-between;align-items:center"><h2>Recent correspondence</h2><button class="lnk" data-a="ctab" data-v="corr">See all</button></div>${corrList('c:'+k,3)}</div></div></div>`}

V.sprov=()=>{if(S.prov&&PROV[S.prov])return provProfile(S.prov);S.prov=null;

 return `<div class="qtop"><div><h1>Workers and providers</h1><p class="m">Everyone who delivers services to your customers, with their checks and paperwork.</p></div></div>
 <div class="qtable"><div class="lrow lh" aria-hidden="true"><span></span><span>Name</span><span>Registration</span><span>Customers</span><span>Checks</span><span style="text-align:right">Open items</span></div>
 ${ks.map(k=>{const v=PROV[k],p=P[k],bad=v.docs.filter(d=>d[2]=='bad').length,due=v.docs.filter(d=>d[2]=='due').length,open=openOf(t=>t.pid==k&&t.st!='done');
  return `<button class="lrow" data-a="sopen" data-v="p:${k}">${face(k,32)}<span class="is"><b>${esc(p.name)}</b><span>${esc(p.title||v.type)}</span></span><span class="lc">${esc(v.reg)}</span><span class="lc">${v.clients.map(x=>esc(P[x].first||P[x].name)).join(', ')}</span><span class="lc">${bad?'<span class="pill bad">Action needed</span>':due?'<span class="pill warn">Due soon</span>':'<span class="pill ok">All current</span>'}</span><span class="du ${open.some(t=>tixDue(t)<Date.now())?'over':''}">${open.length}</span></button>`}).join('')}</div>`};
function provProfile(k){const v=PROV[k],p=P[k],e='p:'+k,tab=S.ptab||'over',items=openOf(t=>t.pid==k),nOpen=items.filter(t=>t.st!='done').length,nChk=v.docs.filter(d=>d[2]!='ok').length;

 <div class="acts"><a class="btn sm ghost" href="${tel(v.phone)}">${ico('phone')}Call</a><a class="btn sm ghost" href="mailto:${v.email}">${ico('mail')}Email</a><button class="btn sm p" data-a="ctab" data-v="corr">${ico('plus')}Log correspondence</button></div></div>
 ${profTabs(tab,[['over','Overview'],['docs','Checks and documents',nChk],['corr','Correspondence'],['work','Work items',nOpen]],'ctab')}
 ${tab=='over'?provOver(k):tab=='corr'?`<div class="pgrid"><div class="psec"><h2>Log correspondence</h2>${corrForm(e)}</div><div class="psec"><h2>History</h2>${corrList(e)}</div></div>`:tab=='docs'?`<div class="psec"><h2>Checks and documents</h2>${docsTable(v.docs)}</div>`:`<div class="qtable">${items.length?items.sort(tixSort).map(tixRow).join(''):'<p class="qempty">No work items for this provider.</p>'}</div>`}`}
const PINV={lena:[['Showering and dressing','margaret',1.5,72]],priya:[['House cleaning','margaret',3,62]],marcus:[['House cleaning','noah',3,65]],dale:[['Yard maintenance','jamie',2,57]],omar:[['Community outing','jamie',4,60]],grace:[['Nursing visit','arthur',1,110]],bright:[['Physiotherapy session','noah',1,180],['Physiotherapy session','noah',1,180]]};
function provOver(k){const v=PROV[k],p=P[k],invs=(PINV[k]||[]).map(([item,who,hrs,rate])=>({item,who,hrs,rate})).filter(i=>CUST[i.who].mods.some(modOn));

 <div class="psec"><h2>Customers</h2><ul class="clist">${v.clients.map(x=>`<li><button class="plink" data-a="sopen" data-v="c:${x}">${face(x,32)}<span class="grow"><b>${esc(P[x].name)}</b><span class="m">${esc(CUST[x]?.fund||'')}</span></span>${ico('chev')}</button></li>`).join('')}</ul></div></div>
 <div class="pcol"><div class="psec"><h2>Checks needing attention</h2>${compRows(v.docs.filter(d=>d[2]!='ok').map(d=>[d[0],d[3],d[2],d[1]]))}</div>
 ${invs.length&&(S.mods.plan||S.mods.platform)?`<div class="psec"><h2>Recent invoices</h2><ul class="clist">${invs.map(i=>`<li><span class="ic-w">${ico('wallet')}</span><div class="grow"><b>${esc(i.item)} for ${esc(P[i.who].first)}</b><span class="m">${i.hrs} hrs at ${money(i.rate)}/hr</span></div><span class="num" style="font-weight:700">${money(i.hrs*i.rate)}</span></li>`).join('')}</ul></div>`:''}
 <div class="psec"><div class="row" style="justify-content:space-between;align-items:center"><h2>Recent correspondence</h2><button class="lnk" data-a="ctab" data-v="corr">See all</button></div>${corrList('p:'+k,3)}</div></div></div>`}
function tixLog(t,x,k){t.log.push({t:Date.now(),by:'Kim Nguyen',x,k})}
function addCorr(t,c){const e=c.to||(t.who?'c:'+t.who:'p:'+t.pid),w=c.to?c.to.split(':')[1]:t.who?(CUST[t.who]?.rep||t.who):t.pid;
 S.corr.push({e,t:Date.now(),ch:c.ch,dir:c.dir,w,sub:c.sub,note:c.note,by:'Kim Nguyen',mod:tMod(t)})}
function staffAct(a,v,el){switch(a){
 case'tq':S.tq=v;return;
 case'snav':S.tab=v;if(v=='scust')S.cust=null;if(v=='sprov')S.prov=null;S.sheet=null;window.scrollTo(0,0);return;
 case'tixopen':{const t=S.tix.find(z=>z.id==v);if(isDesk()){if(S.tab!='squeue'){S.tab='squeue';S.tq=t.st=='done'?'done':'all';S.tqt='all';window.scrollTo(0,0)}S.tsel=v;S.sheet=null}else S.sheet={type:'tix',k:v};return}
 case'tixtool':toast('In a live setup this opens the provider\'s '+v+'.');return false;
 case'tixown':{const t=S.tix.find(z=>z.id==v);if(t.owner=='kim'){t.owner=null;tixLog(t,'Unassigned myself.')}else{t.owner='kim';if(t.st=='open')t.st='prog';tixLog(t,'Assigned to me.')}return}
 case'tixact':{const[id,k]=v.split('|'),t=S.tix.find(z=>z.id==id),ac=TIX_ACTS[t.type].find(z=>z.k==k);if(!t.owner)t.owner='kim';tixLog(t,ac.log,k);t.st=ac.st;if(ac.st=='done')t.closed=Date.now();
  if(ac.corr)addCorr(t,ac.corr);
  if(t.type=='checkin'&&(k=='ok'||k=='fu')&&CUST[t.who]?.contact)CUST[t.who].contact.last=0;
  if(t.type=='checkin'&&k=='na'){t.due=Date.now()+864e5;t.log=t.log.filter(l=>l.k!='na');t.log.push({t:Date.now(),by:'app',x:'Moved to tomorrow after no answer.'})}

 case'tixnote':case'tixdone':{const t=S.tix.find(z=>z.id==v),n=($('#tixnote')||{}).value?.trim();if(!n){toast(a=='tixdone'?'Add a note saying how it was closed':'Type a note first');return false}if(!t.owner)t.owner='kim';tixLog(t,n);if(a=='tixdone'){t.st='done';t.closed=Date.now();toast('Done')}else{if(t.st=='open')t.st='prog';toast('Note added')}return}

  if(k=='c'&&dir=='out'&&(ch=='call'||ch=='visit')&&CUST[id]?.contact)CUST[id].contact.last=0;toast('Saved to record');return}
 case'docview':toast('In a live setup this opens the file from the provider\'s document store.');return false;

 }return 'na'}

setInterval(()=>{const n=document.getElementById('tixnote'),ae=document.activeElement;if(S.role=='staff'&&S.tab=='squeue'&&!S.sheet&&!(n&&n.value)&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))R()},60000);
document.addEventListener('change',e=>{if(e.target.id=='tqtype'){S.tqt=e.target.value;R()}else if(e.target.dataset&&e.target.dataset.mod){S.mods[e.target.dataset.mod]=e.target.checked;R()}});
{let dw=null;addEventListener('resize',()=>{const d=isDesk();if(S.role=='staff'&&d!==dw){dw=d;if(d&&S.sheet?.type=='tix'){S.tsel=S.sheet.k;S.sheet=null}R()}})}

R();
